apiVersion: v1
kind: Service
metadata:
    name: powersync
    namespace: powersync
spec:
    selector:
        app: powersync
    ports:
        - name: http
          port: 8080
          targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: powersync
    namespace: powersync
spec:
    replicas: 1
    selector:
        matchLabels:
            app: powersync
    template:
        metadata:
            labels:
                app: powersync
        spec:
            initContainers:
                - name: wait-for-mongo-rs
                  image: mongo:7.0
                  command:
                      - bash
                      - -ec
                      - |
                          until mongosh --host mongo:27017 --eval "try{rs.status().ok===1 ? quit(0) : quit(1)}catch(e){quit(1)}"; do
                            echo "waiting for mongo replica set"
                            sleep 2
                          done
                - name: wait-for-postgres
                  image: postgres:18
                  env:
                      - name: PGUSER
                        value: "postgres"
                      - name: PGDATABASE
                        value: "splittery"
                      - name: PGPASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: database-secrets
                                key: password
                  command:
                      - sh
                      - -ec
                      - |
                          until pg_isready -h pg-db -p 5432 -U "$PGUSER" -d "$PGDATABASE"; do
                            echo "waiting for postgres"
                            sleep 2
                          done
            containers:
                - name: powersync
                  image: journeyapps/powersync-service:latest
                  command:
                      - start
                      - -r
                      - unified
                  ports:
                      - name: http
                        containerPort: 8080
                  env:
                      - name: POWERSYNC_CONFIG_PATH
                        value: /config/service.yaml
                      - name: NODE_OPTIONS
                        value: --max-old-space-size=1000
                      - name: PS_DATA_SOURCE_URI
                        valueFrom:
                            secretKeyRef:
                                name: database-secrets
                                key: url
                      - name: PS_MONGO_URI
                        valueFrom:
                            secretKeyRef:
                                name: app-secrets
                                key: PS_MONGO_URI
                      - name: PS_JWKS_URL
                        valueFrom:
                            secretKeyRef:
                                name: app-secrets
                                key: PS_JWKS_URL
                      - name: PS_PORT
                        valueFrom:
                            secretKeyRef:
                                name: app-secrets
                                key: PS_PORT
                  volumeMounts:
                      - name: powersync-config
                        mountPath: /config
                        readOnly: true
                  readinessProbe:
                      httpGet:
                          path: /probes/liveness
                          port: 8080
                      initialDelaySeconds: 8
                      periodSeconds: 5
                      timeoutSeconds: 2
                  livenessProbe:
                      httpGet:
                          path: /probes/liveness
                          port: 8080
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      timeoutSeconds: 2
            volumes:
                - name: powersync-config
                  configMap:
                      name: powersync-config
