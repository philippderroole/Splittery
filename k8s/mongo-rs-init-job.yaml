apiVersion: batch/v1
kind: Job
metadata:
    name: mongo-rs-init
    namespace: powersync
spec:
    backoffLimit: 6
    template:
        spec:
            restartPolicy: OnFailure
            containers:
                - name: mongo-rs-init
                  image: mongo:7.0
                  command:
                      - bash
                      - -ec
                      - |
                          until mongosh --host mongo:27017 --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1; do
                            echo "waiting for mongo"
                            sleep 2
                          done

                          mongosh --host mongo:27017 --eval 'try{if(rs.status().ok===1){quit(0)}}catch(e){} rs.initiate({_id:"rs0",version:1,members:[{_id:0,host:"mongo:27017"}]})'
