apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: postgres
    namespace: splittery
spec:
    serviceName: "database-service"
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
                - name: postgres
                  image: postgres:17
                  ports:
                      - containerPort: 5432
                  env:
                      - name: POSTGRES_USER
                        value: postgres
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: database-secrets
                                key: password
                      - name: POSTGRES_DB
                        value: splittery
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql/data
                  readinessProbe:
                      exec:
                          command:
                              - sh
                              - -c
                              - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 5
                  livenessProbe:
                      tcpSocket:
                          port: 5432
                      initialDelaySeconds: 15
                      periodSeconds: 10
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                  requests:
                      storage: 5Gi
