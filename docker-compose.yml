services:
    # Creates the internal MongoDB replica set used by PowerSync
    mongo:
        image: mongo:7.0
        command: --replSet rs0 --bind_ip_all --quiet
        restart: unless-stopped
        ports:
            - "27017:27017"
        volumes:
            - mongo_storage:/data/db

    mongo-rs-init:
        image: mongo:7.0
        depends_on:
            - mongo
        restart: on-failure
        entrypoint:
            - bash
            - -c
            - 'mongosh --host mongo:27017 --eval ''try{rs.status().ok && quit(0)} catch {} rs.initiate({_id: "rs0", version: 1, members: [{ _id: 0, host : "mongo:27017" }]})'''

    # PowerSync service with config mounted from the repo root config folder
    powersync:
        restart: unless-stopped
        image: journeyapps/powersync-service:latest
        command: [ "start", "-r", "unified" ]
        volumes:
            - ./config:/config
        environment:
            POWERSYNC_CONFIG_PATH: /config/service.yaml
            NODE_OPTIONS: --max-old-space-size=1000
            PS_DATA_SOURCE_URI: postgresql://postgres:password@postgres:5432/splittery
            PS_MONGO_URI: mongodb://mongo:27017/powersync_demo
            PS_JWKS_URL: ${PS_JWKS_URL}
            PS_PORT: ${PS_PORT}
        healthcheck:
            test: [ "CMD", "node", "-e", "fetch('http://localhost:${PS_PORT}/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
            interval: 5s
            timeout: 1s
            retries: 15
        depends_on:
            mongo-rs-init:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            backend:
                condition: service_healthy
        ports:
            - "${PS_PORT}:${PS_PORT}"
    postgres:
        image: postgres:18
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_DB: splittery
            POSTGRES_PASSWORD: password
            PGPORT: 5432
        ports:
            - "5432:5432"
        command: [ "postgres", "-c", "wal_level=logical" ]
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
            interval: 5s
            timeout: 5s
            retries: 5
    frontend:
        build:
            context: frontend/.
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        environment:
            - INTERNAL_API_URL=http://backend:8000/api/v1
    backend:
        build:
            context: backend/.
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        volumes:
            - .:/app
        environment:
            - DATABASE_URL=postgresql://postgres:password@postgres:5432/splittery
            - RUST_LOG=debug
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
            interval: 5s
            timeout: 1s
            retries: 15
        depends_on:
            - postgres

volumes:
    mongo_storage:
